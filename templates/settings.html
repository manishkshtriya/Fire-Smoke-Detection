{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h4 class="card-title">System Settings</h4>
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Fire confidence</label>
          <input class="form-control" name="fire_confidence" type="number" step="0.01" value="{{ settings.fire_confidence }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Smoke confidence</label>
          <input class="form-control" name="smoke_confidence" type="number" step="0.01" value="{{ settings.smoke_confidence }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Detection duration (seconds)</label>
          <input class="form-control" name="detection_duration" type="number" value="{{ settings.detection_duration }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email receiver</label>
          <input class="form-control" name="email_receiver" value="{{ settings.email_receiver }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Alert sound enabled</label>
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" name="alert_sound_enabled" {% if settings.alert_sound_enabled %}checked{% endif %}>
            <label class="form-check-label">Enable alert sound</label>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Camera source</label>
          <input class="form-control" name="camera_source" value="{{ settings.camera_source }}">
        </div>
      </div>
      <button class="btn btn-primary mt-3" type="submit">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
